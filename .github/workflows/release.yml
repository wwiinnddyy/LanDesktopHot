name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT: LanDesktopHot.csproj
  # NuGet.config 里的 lanmountain 源用这两个环境变量取凭据（源地址与凭据槽只在 NuGet.config 说一次）。
  # 不要再跑 dotnet nuget add source：同名源已在 NuGet.config 里，add 直接失败；
  # 而 update source 在 Linux runner 上会撞 "Password encryption is not supported on .NET Core for this platform"。
  LANMOUNTAIN_PACKAGES_USER: ${{ github.actor }}
  LANMOUNTAIN_PACKAGES_TOKEN: ${{ secrets.LANMOUNTAIN_PACKAGES_TOKEN }}

jobs:
  build:
    name: Build and package .laapp
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      # 构建即打包：AirApp SDK 的 MSBuild target 产出 .laapp。
      - name: Build and package
        run: dotnet build ${{ env.PROJECT }} -c Release --no-restore

      - name: Upload .laapp
        uses: actions/upload-artifact@v7
        with:
          name: landesktophot-airapp
          path: '*.laapp'
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.laapp'
          generate_release_notes: true
